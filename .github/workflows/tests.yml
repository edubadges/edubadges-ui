name: Run tests and build

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
