name: Run tests and build

on:
  push:
    branches-ignore:
      - build

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test
      - name: Save build in build branch - dev dir
        uses: sylvanld/action-storage@v1
        with:
          src: public
          dst: dev
          storage-branch: build
          comment: Save dev build
      - name: Removing previous build
        run: |
          rm -rf public
      - run: yarn build:prod
      - name: Save prod build in build branch - prod dir
        uses: sylvanld/action-storage@v1
        with:
          src: public
          dst: prod
          storage-branch: build
          comment: Save prod build
